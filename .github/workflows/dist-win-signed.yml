name: Build + Sign Windows

# Manual dispatch only: this repo is public, and this job runs on a self-hosted
# runner, so it must never be reachable from a pull request.
on:
  workflow_dispatch:

jobs:
  build-sign-win:
    runs-on: [self-hosted, chryon]
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # resources/python/ is gitignored, so checkout's clean wipes it before every
      # run. The key covers the interpreter pin and the vendored wheels, which are
      # installed into this same directory. No restore-keys on purpose: a partial
      # match would restore a directory built for a different pin.
      - name: Cache bundled Python interpreter + vendored packages
        uses: actions/cache@v4
        with:
          path: resources/python/win32-x64
          key: python-win32-x64-${{ hashFiles('scripts/download-python.mjs', 'scripts/python-version.mjs', 'scripts/vendor-python-packages.mjs', 'resources/requirements-prod.txt') }}

      # electron-builder signs by shelling out to Invoke-TrustedSigning. Provision
      # the module here, in the host it will use (pwsh.exe if present, otherwise
      # powershell.exe; -Scope CurrentUser paths differ), to fail before packaging.
      - name: Verify Azure Trusted Signing prerequisites
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $signHost = 'powershell.exe'
          powershell.exe -NoProfile -NonInteractive -Command 'Get-Command pwsh.exe' *> $null
          if ($LASTEXITCODE -eq 0) { $signHost = 'pwsh.exe' }
          $script = @'
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Module -ListAvailable -Name TrustedSigning |
                    Where-Object { $_.Version -ge [version]'0.5.0' })) {
            try {
              Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force -Scope CurrentUser | Out-Null
            } catch {
              Write-Host "NuGet provider install skipped: $($_.Exception.Message)"
            }
            Install-Module -Name TrustedSigning -MinimumVersion 0.5.0 -Force -Repository PSGallery -Scope CurrentUser
          }
          if (-not (Get-Module -ListAvailable -Name TrustedSigning)) { exit 1 }
          '@
          & $signHost -NoProfile -NonInteractive -Command $script
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::Could not provision the TrustedSigning module in $signHost."
            exit 1
          }

      - name: Build + sign Windows installer
        run: npm run dist:win-ci
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_ENDPOINT: ${{ secrets.AZURE_ENDPOINT }}
          AZURE_CODE_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_CODE_SIGNING_ACCOUNT_NAME }}
          AZURE_CERT_PROFILE_NAME: ${{ secrets.AZURE_CERT_PROFILE_NAME }}
          AZURE_PUBLISHER_NAME: ${{ secrets.AZURE_PUBLISHER_NAME }}

      - name: Upload signed installer to MinIO
        run: node scripts/ci-upload-win-signed.js
        env:
          MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
          MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
          MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
