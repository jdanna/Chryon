afterPack: build/afterPackHook.js
appId: com.retrograde.maxinestudio
productName: MAXINE Studio
directories:
  buildResources: resources
files:
  - out/**
  - package.json
extraResources:
  - from: tools
    to: tools
    filter:
      - "*.py"
      - footer_template.bin
win:
  executableName: MaxineStudio
  extraResources:
    - from: resources/python/win32-x64/python
      to: python
  target:
    - target: nsis
      arch:
        - x64
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  category: public.app-category.utilities
  identity: null
  extraResources:
    - from: resources/python/darwin-arm64/python
      to: python
    - from: resources/emulator/darwin-arm64
      to: emulator
  target:
    - target: dmg
      arch:
        - arm64
dmg:
  artifactName: ${name}-${version}-${arch}.${ext}
linux:
  executableName: maxine-studio
  category: Utility
  icon: resources/icon.png
  artifactName: ${name}-${version}-${arch}.${ext}
  extraResources:
    - from: resources/python/linux-x64/python
      to: python
    - from: resources/emulator/linux-x64
      to: emulator
    - from: resources/icon.png
      to: icon.png
  target:
    - target: AppImage
      arch:
        - x64
npmRebuild: false
publish: null
