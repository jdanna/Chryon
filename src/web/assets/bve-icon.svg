<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- The BVE-9100's AUTO REC key, seen from above and in front: the top face, its skirt on four sides
       (the front tallest, as the eye is in front), and REC on the front of the skirt -->
  <defs>
    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0624a"/>
      <stop offset="1" stop-color="#dc4732"/>
    </linearGradient>
    <radialGradient id="dish" cx="0.5" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#fff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b8361f"/>
      <stop offset="1" stop-color="#8c2515"/>
    </linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ad321d"/>
      <stop offset="1" stop-color="#c63e27"/>
    </linearGradient>
    <linearGradient id="right" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#a02e1b"/>
      <stop offset="1" stop-color="#bf3b25"/>
    </linearGradient>
    <clipPath id="cap"><rect x="10" y="8" width="108" height="110" rx="12"/></clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <g clip-path="url(#cap)">
      <polygon points="10,8 118,8 108,13 20,13" fill="#cf432c"/>
      <polygon points="10,8 20,13 20,82 10,118" fill="url(#left)"/>
      <polygon points="118,8 108,13 108,82 118,118" fill="url(#right)"/>
      <polygon points="20,82 108,82 118,118 10,118" fill="url(#front)"/>
    </g>
    <!-- edge highlights where the top face meets the skirt -->
    <rect x="19" y="12" width="90" height="71" rx="7" fill="none" stroke="#ff8f78" stroke-opacity="0.5" stroke-width="1.5"/>
    <rect x="20" y="13" width="88" height="69" rx="6" fill="url(#top)"/>
    <rect x="20" y="13" width="88" height="69" rx="6" fill="url(#dish)"/>
  </g>

  <!-- Legends as on the real key: the letter top left, the function centred, the shifted one on the front -->
  <g fill="#2a1410" fill-opacity="0.88" font-family="Helvetica, Arial, sans-serif" font-weight="500">
    <text x="27" y="27" font-size="11">E</text>
    <g text-anchor="middle" font-size="14.5">
      <text x="64" y="44">AUTO</text>
      <text x="64" y="60">REC</text>
      <text x="64" y="76">OFF</text>
    </g>
    <!-- on the front of the skirt, squashed as it slopes away -->
    <text text-anchor="middle" font-size="12" font-weight="700" letter-spacing="0.5" transform="translate(64 105) scale(1.1 0.78)">REC</text>
  </g>
</svg>
